[project]
name = "ebsmcp-management-api"
version = "0.1.0"
description = "Backend API for the admin GUI: identity-mapping onboarding and audit-log review"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
    "oracledb>=2.4",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.9",
    "bcrypt>=4.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
pythonpath = ["."]
