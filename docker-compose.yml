# Local/dev stack for all five pieces of EBSMCP. Two shortcuts here are
# deliberately NOT how a real deployment should look:
#
# 1. A single Postgres superuser (postgres/postgres) owns both databases.
#    Each service's own docs (management-api/.env.example, audit-service's
#    db/provisioning.py) describe least-privilege roles per database
#    (mgmt_identity_writer, mgmt_audit_reader, ebsmcp_audit_writer/reader)
#    — worth provisioning for anything beyond a laptop.
# 2. EBS_DB_DSN (or EBSMCP_EBS_INSTANCES, for more than one EBS database —
#    see mcp-server/.env.example), ADMIN_SESSION_SECRET, and the Entra vars
#    are left unset, same as every service's .env.example: mcp-server and
#    management-api fall back to their mock/stub connectors and admin_gui
#    keeps the free-text "Acting as" stub instead of real sign-in. Set them
#    here (or in a docker-compose.override.yml) to point at real EBS/Entra.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - ebsmcp_postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  identity-migrate:
    build: ./identity-service
    environment:
      IDENTITY_DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ebsmcp_identity
    depends_on:
      postgres:
        condition: service_healthy

  audit-migrate:
    build: ./audit-service
    environment:
      AUDIT_DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ebsmcp_audit
    depends_on:
      postgres:
        condition: service_healthy

  management-api:
    build: ./management-api
    environment:
      IDENTITY_DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ebsmcp_identity
      AUDIT_DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ebsmcp_audit
      # Unset (the default when no root .env exists) keeps the
      # X-Admin-Subject stub active — see app/deps.py. Set ADMIN_SESSION_SECRET
      # in a root .env file to switch this deployment to real admin sign-in;
      # keep admin-gui's VITE_LOCAL_ADMIN_AUTH_ENABLED build arg below in sync
      # with it, since a login form with no secret configured 503s forever.
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
    ports:
      - "8010:8010"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
      audit-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  admin-gui:
    build:
      context: ./admin-gui
      args:
        # Browser-reachable origin, so the host-mapped port above, not the
        # in-network service name — see the ARG comment in admin-gui/Dockerfile.
        VITE_API_BASE_URL: http://localhost:8010
        # Must agree with management-api's ADMIN_SESSION_SECRET above: true
        # shows a real login form (AdminIdentity.tsx), which needs a
        # configured secret and at least one admin_accounts row to ever
        # succeed (see scripts/create_admin.py).
        VITE_LOCAL_ADMIN_AUTH_ENABLED: "true"
    ports:
      - "5174:80"
    depends_on:
      - management-api
    restart: unless-stopped

  mcp-server:
    build: ./mcp-server
    environment:
      IDENTITY_DB_URL: postgresql+psycopg://postgres:postgres@postgres:5432/ebsmcp_identity
      # Every var below is client-specific and left unset (mock EBS
      # connector, no real Entra auth, DNS-rebinding protection rejecting
      # every host) until a root .env file or docker-compose.override.yml
      # sets it — see mcp-server/.env.example for what each one looks like
      # filled in. The {}/[] fallbacks on the JSON-decoded ones are
      # required, not decorative: pydantic-settings fails to start at all
      # on an empty string for a dict/list field, unlike the plain string
      # vars below it, where an empty string is already a safe "unset".
      EBSMCP_EBS_INSTANCES: ${EBSMCP_EBS_INSTANCES:-{}}
      EBS_DB_DSN: ${EBS_DB_DSN:-}
      EBS_DB_USER: ${EBS_DB_USER:-}
      EBS_DB_PASSWORD: ${EBS_DB_PASSWORD:-}
      EBSMCP_ENTRA_TENANT_ID: ${EBSMCP_ENTRA_TENANT_ID:-}
      EBSMCP_ENTRA_AUDIENCE: ${EBSMCP_ENTRA_AUDIENCE:-}
      EBSMCP_ENTRA_SUBJECT_CLAIM: ${EBSMCP_ENTRA_SUBJECT_CLAIM:-preferred_username}
      EBSMCP_RESOURCE_SERVER_URL: ${EBSMCP_RESOURCE_SERVER_URL:-}
      EBSMCP_ALLOWED_HOSTS: ${EBSMCP_ALLOWED_HOSTS:-[]}
      EBSMCP_ALLOWED_ORIGINS: ${EBSMCP_ALLOWED_ORIGINS:-[]}
    ports:
      - "8080:8080"
    depends_on:
      identity-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  ebsmcp_postgres_data:
