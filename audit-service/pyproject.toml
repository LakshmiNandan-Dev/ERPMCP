[project]
name = "ebsmcp-audit-service"
version = "0.1.0"
description = "Append-only audit-log schema and migrations for the EBS/Fusion MCP platform"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "oracledb>=2.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["db"]
