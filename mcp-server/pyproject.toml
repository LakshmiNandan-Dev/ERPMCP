[project]
name = "ebsmcp-server"
version = "0.1.0"
description = "MCP server core bridging Oracle EBS and Fusion to Copilot and AI agents"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=2.1.0,<3.0.0",
    "oracledb>=2.4.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt[crypto]>=2.9",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.1",
]

[project.scripts]
ebsmcp-server = "ebsmcp.server:main"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ebsmcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
